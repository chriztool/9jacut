# Builds the iPhone app on GitHub's Mac machines, so no Mac is needed.
#
# The simulator job builds for the iPhone SIMULATOR, starts the app on a
# simulated iPhone, runs a real export self-test through the native ffmpeg
# plugin, and saves a screenshot. FFmpeg comes from the ffmpeg-ios-lgpl-*
# release made by build-ffmpeg-ios.yml.
#
# Once the Apple Developer account is ready, a signed build + TestFlight
# upload gets added here so the app can go on a real iPhone.
#
# Runs on every push to the `ios` branch, and from the Actions tab.
name: Build iOS app

on:
  push:
    branches: [ios]
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use the newest Xcode on the machine
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # --ignore-scripts: the phone build only needs the Capacitor packages,
      # not the desktop-only downloads (Electron, ffmpeg-static, sherpa-onnx).
      - name: Install
        run: npm install --ignore-scripts

      - name: Build the phone web bundle and copy it into the iOS project
        run: npm run ios:sync

      - name: Build for the iPhone simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -40
          test -d build/Build/Products/Debug-iphonesimulator/App.app

      - name: Start a simulated iPhone
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app

      # The app makes a test video with ffmpeg and exports it with text, a
      # sticker and a look through the native plugin (mobile/bridge.js,
      # runSelfTest), then prints 9JACUT_SELFTEST PASS or FAIL.
      - name: Export self-test on the simulated iPhone
        run: |
          xcrun simctl launch --console-pty --terminate-running-process "$DEVICE" com.ninejacut.app -NineJaCutSelfTest > selftest-log.txt 2>&1 &
          LAUNCH=$!
          sleep 5
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.ninejacut.app data)
          RESULT="$DATA/Documents/selftest-result.txt"
          for i in $(seq 1 200); do
            grep -qE '9JACUT_SELFTEST (PASS|FAIL)' "$RESULT" 2>/dev/null && break
            sleep 2
          done
          kill $LAUNCH 2>/dev/null || true
          xcrun simctl terminate "$DEVICE" com.ninejacut.app || true
          cp "$RESULT" selftest-result.txt 2>/dev/null || echo "(no result file)" > selftest-result.txt
          cat selftest-result.txt
          if ! grep -q '9JACUT_SELFTEST PASS' selftest-result.txt; then
            # If the app crashed, the simulator leaves a crash report on the Mac.
            CRASH=$(ls -t ~/Library/Logs/DiagnosticReports/App*.ips 2>/dev/null | head -1)
            if [ -n "$CRASH" ]; then
              cp "$CRASH" crash-report.ips
              python3 - "$CRASH" > crash-summary.txt <<'PY' || true
          import json, sys
          raw = open(sys.argv[1]).read().split('\n', 1)
          body = json.loads(raw[1])
          exc = body.get('exception', {})
          print('CRASH', exc.get('type'), exc.get('signal'), body.get('termination', {}).get('indicator', ''))
          images = body.get('usedImages', [])
          for th in body.get('threads', []):
              if th.get('triggered'):
                  for fr in th.get('frames', [])[:14]:
                      img = images[fr['imageIndex']].get('name', '?') if fr.get('imageIndex', -1) < len(images) else '?'
                      print(' ', img, fr.get('symbol', hex(fr.get('imageOffset', 0))))
          PY
            fi
            NOTE=$( (cat selftest-result.txt; cat crash-summary.txt 2>/dev/null; echo '--- app output ---'; grep -vE 'DiskCookieStorage' selftest-log.txt | tail -25) | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Export self-test did not pass::${NOTE}"
            exit 1
          fi
          echo "::notice title=Export self-test passed::$(grep -o '9JACUT_SELFTEST PASS.*' selftest-result.txt | head -1)"

      - name: Take a screenshot of the app
        if: always()
        run: |
          [ -n "${DEVICE:-}" ] || exit 0
          xcrun simctl launch --terminate-running-process "$DEVICE" com.ninejacut.app
          sleep 20
          xcrun simctl io "$DEVICE" screenshot ios-simulator.png
          xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "App"' --style compact > ios-app-log.txt || true

      - name: Keep the screenshot, log and simulator app
        if: always()
        run: |
          if [ -d build/Build/Products/Debug-iphonesimulator/App.app ]; then
            cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/9jaCut-simulator.zip" App.app
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 9jacut-ios-simulator
          path: |
            ios-simulator.png
            ios-app-log.txt
            selftest-log.txt
            selftest-result.txt
            crash-report.ips
            9jaCut-simulator.zip
          if-no-files-found: ignore
          retention-days: 14

  # Signed build uploaded to TestFlight, so it can be installed on a real
  # iPhone with Apple's TestFlight app. Skipped until these repository
  # secrets exist (Settings > Secrets and variables > Actions):
  #   APPLE_TEAM_ID           your 10-character Team ID (developer.apple.com > Account > Membership)
  #   ASC_KEY_ID              App Store Connect API key ID
  #   ASC_ISSUER_ID           App Store Connect API issuer ID
  #   ASC_KEY_P8              the full text of the downloaded AuthKey_XXXX.p8 file
  # The app must also exist in App Store Connect with bundle ID com.ninejacut.app.
  testflight:
    needs: simulator
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check the Apple keys are set up
        id: keys
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight upload skipped: add the APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets to turn it on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Use the newest Xcode on the machine
        if: steps.keys.outputs.ready == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install and build the phone web bundle
        if: steps.keys.outputs.ready == 'true'
        run: |
          npm install --ignore-scripts
          npm run ios:sync

      - name: Build, sign and upload to TestFlight
        if: steps.keys.outputs.ready == 'true'
        run: |
          set -eo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          VERSION=$(node -p "require('./package.json').version")
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/9jaCut.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" | tail -30

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/9jaCut.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -30
          echo "::notice::Uploaded 9jaCut $VERSION (build ${{ github.run_number }}) to TestFlight. It shows up in the TestFlight app after Apple finishes processing (usually 10-30 minutes)."
          rm -f "$KEY_PATH"
