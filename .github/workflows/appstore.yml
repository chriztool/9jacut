name: App Store listing

# Fills in the App Store listing from mobile/appstore/ through the App Store
# Connect API and attaches the newest build. When "submit": true is set in
# mobile/appstore/metadata.json it then sends the version to App Review
# (waiting up to 45 minutes for the newest build to finish processing).
# Uses the same API key as the TestFlight upload.
on:
  push:
    branches: [ios]
    paths:
      - 'mobile/appstore/**'
      - 'scripts/appstore.py'
      - '.github/workflows/appstore.yml'

concurrency: appstore

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the Apple account details
        run: |
          set -a; source mobile/ios-signing.env; set +a
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
      - run: pip install pyjwt cryptography requests
      - name: Fill in the listing (and submit when asked)
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('mobile/appstore/metadata.json')).get('submit') else 1)"; then
            python3 scripts/appstore.py --submit
          else
            python3 scripts/appstore.py
          fi
